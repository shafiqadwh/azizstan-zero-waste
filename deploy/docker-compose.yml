name: azizstan-zero-waste

x-app-env: &app-env
  env_file: ../.env
  environment:
    TZ: Asia/Bangkok
    DATA_DIR: /data

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
      POSTGRES_DB: zw
      POSTGRES_USER: zw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No host bind for backups: deploy/backup.sh streams pg_dump out through `exec`. (A ./backup bind also broke
    # on Synology, whose Docker refuses a missing bind source instead of creating it.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zw -d zw"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1g }
    networks: [internal]
    # No "ports:" — the database is never reachable from the host or LAN.

  # One-shot: applies pending migrations (schema, constraints, reference data) before app and worker start.
  # Same command by hand: docker compose -f deploy/docker-compose.yml run --rm app node scripts/migrate.js
  migrate:
    image: azizstan-zero-waste:${APP_VERSION:-latest}
    command: ["node", "scripts/migrate.js"]
    restart: "no"
    <<: *app-env
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  app:
    image: azizstan-zero-waste:${APP_VERSION:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["node", "server.js"]
    restart: unless-stopped
    <<: *app-env
    volumes:
      - app-data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 768m }
    networks: [internal]
    # Expose to LAN only for local testing:  ports: ["127.0.0.1:3000:3000"]

  worker:
    image: azizstan-zero-waste:${APP_VERSION:-latest}
    command: ["node", "worker/index.js"]
    restart: unless-stopped
    stop_grace_period: 30s
    <<: *app-env
    volumes:
      - app-data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 1g }
    networks: [internal]

  # Public access through Cloudflare Tunnel. Off unless the "tunnel" profile is on (COMPOSE_PROFILES=tunnel in
  # .env, production); the NAS test setup can stay LAN-only without a token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]
    networks: [internal]

volumes:
  db-data:
  app-data:

networks:
  internal:
    driver: bridge
